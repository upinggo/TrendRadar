name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package (with image extra)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[image]"

      - name: Import smoke test
        run: |
          python -c "import trendradar; print('trendradar OK', getattr(trendradar, '__version__', '?'))"
          python -c "import mcp_server; print('mcp_server OK')"
          python -c "from trendradar.notification import senders, dispatcher; print('notification OK')"

      - name: Pipeline reliability regression tests
        env:
          LITELLM_LOCAL_MODEL_COST_MAP: "True"
        run: |
          python -m unittest discover -s tests -p "test_pipeline_reliability.py" -v
          python -m unittest discover -s tests -p "test_ai_extra_params.py" -v

      - name: Syntax check
        run: python -m compileall -q trendradar mcp_server scripts

  visual-report:
    name: visual-report
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pytest-playwright
          python -m playwright install --with-deps chromium

      - name: Run visual-flow pytest gate
        run: python -m pytest -q tests/test_report_visual_flow.py

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-visual-flow
          path: artifacts/report-visual-flow.png
          if-no-files-found: ignore
